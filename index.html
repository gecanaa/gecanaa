<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070707" />
    <meta name="description" content="Chamada e fichas dos integrantes do Grupo Escoteiro Canaã 52/DF." />
    <title>SGE Canaã 52</title>
    <link rel="icon" href="favicon-32.png?v=2" type="image/png" sizes="32x32" />
    <link rel="icon" href="icone-192.png?v=2" type="image/png" sizes="192x192" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icone-180.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Canaã 52" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      /* Embutido de propósito: a abertura precisa estar certa antes de
         qualquer folha de estilo externa chegar. */
      html, body { margin: 0; background: #070707; }
      #abertura {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #070707;
        font-family: system-ui, sans-serif;
      }
      #abertura img { width: 176px; height: 176px; }
      #abertura p {
        margin: 0;
        max-width: 24ch;
        padding: 0 1.5rem;
        color: #d2ac67;
        font-size: 1.3rem;
        line-height: 1.4;
        font-weight: 600;
        text-align: center;
      }
      html.montado #abertura { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="abertura">
      <img src="icone-512.png?v=2" alt="Grupo Escoteiro Canaa 52" />
      <p id="abertura-frase">Sempre alerta para servir.</p>
    </div>
    <script>
      (function () {
        var frases = [
          'Sempre alerta para servir.',
          'Deixe o mundo melhor do que voce o encontrou.',
          'Melhor esforco, todo dia.',
          'Uma boa acao por dia.',
          'Aqui se aprende fazendo.',
          'A felicidade esta em fazer os outros felizes.',
          'Natureza, servico e amizade.',
          'O caminho se faz caminhando.'
        ];
        var no = document.getElementById('abertura-frase');
        if (no) no.textContent = frases[Math.floor(Math.random() * frases.length)];
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
